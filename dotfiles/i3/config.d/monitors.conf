# Layout dos monitores desta máquina (ultrawide à esquerda, Dell touch à direita).
# Para mudar: ajuste no arandr e copie as posições para ~/.screenlayout/hyperspace.sh (e para o repo).
# Salvar direto pelo arandr funciona, mas perde o --primary e a tolerância a monitor desligado.
# (o input-watch remapeia o touch e reposiciona a polybar sozinho).
exec --no-startup-id ~/.screenlayout/hyperspace.sh
