# Acesso remoto pelo hyperspace (Sunshine -> Moonlight) numa tela ultrawide virtual.
# A tela do notebook fica desligada; para usar o notebook na mão: legion-display notebook
exec --no-startup-id ~/.local/bin/legion-display ultrawide
# $mod do Legion é Alt (ver config): Caps Lock é do i3 do hyperspace e o Moonlight
# não repassa a tecla Windows sem capturar o teclado inteiro.
