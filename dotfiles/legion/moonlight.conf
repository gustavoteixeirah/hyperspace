# Chaves do Moonlight no hyperspace, em
# ~/.config/Moonlight Game Streaming Project/Moonlight.conf, seção [General].
# Edite com o Moonlight FECHADO (ele regrava o arquivo ao sair).
# O 9_legion_remote.sh aplica isto.
width=3440
height=1440
fps=100
bitrate=80000
autoadjustbitrate=false
# 1 = tela cheia sem borda (fullscreen desktop), no monitor onde a janela estiver
windowmode=1
# "Otimizar mouse para área de trabalho remota": o mouse não fica preso na janela
mouseacceleration=true
# 0 = nunca captura o teclado: os atalhos do i3 do hyperspace (Caps) funcionam sempre.
# Efeito colateral: a tecla Windows não é repassada ao Legion (por isso lá o $mod é Alt).
capturesyskeys=0
