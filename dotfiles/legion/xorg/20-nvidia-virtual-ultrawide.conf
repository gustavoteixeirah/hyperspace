# Monitor ultrawide "virtual" para acesso remoto (Sunshine/Moonlight a partir do hyperspace).
# A saída DP-0 (DFP-0) não tem nada ligado; o driver finge que o ASUS XG35V (3440x1440)
# está conectado, usando o EDID copiado do monitor real do hyperspace.
# DFP-5 = tela interna do notebook (DP-4 no xrandr), mantida para poder voltar a usá-la.
# Para desfazer: apague este arquivo e reinicie o X.
Section "Device"
    Identifier "nvidia-virtual-ultrawide"
    Driver     "nvidia"
    BusID      "PCI:1:0:0"
    Option     "AllowEmptyInitialConfiguration" "true"
    Option     "ConnectedMonitor" "DFP-0, DFP-5"
    Option     "CustomEDID" "DFP-0:/etc/X11/edid/asus-xg35v.edid"
EndSection
