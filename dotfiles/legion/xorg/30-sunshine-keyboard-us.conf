# Teclado virtual do Sunshine (o que chega do hyperspace pelo Moonlight) usa layout US,
# como o teclado do hyperspace. O teclado do notebook continua ABNT2 (00-keyboard.conf).
Section "InputClass"
    Identifier "sunshine-keyboard-us"
    MatchProduct "libvirtualhid Keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us"
    Option "XkbModel" "pc105"
    Option "XkbVariant" ""
    Option "XkbOptions" "terminate:ctrl_alt_bksp"
EndSection
