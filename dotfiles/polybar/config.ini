; Polybar — hyperspace
; Paleta Catppuccin Mocha. Docs: https://github.com/polybar/polybar/wiki
; Gerado/versionado em ~/code/hyperspace/dotfiles/polybar (instalado por 8_polybar.sh)

[colors]
base     = #1e1e2e
mantle   = #181825
crust    = #11111b
surface0 = #313244
surface1 = #45475a
overlay0 = #6c7086
text     = #cdd6f4
subtext  = #a6adc8
mauve    = #cba6f7
blue     = #89b4fa
sapphire = #74c7ec
teal     = #94e2d5
green    = #a6e3a1
yellow   = #f9e2af
peach    = #fab387
red      = #f38ba8
pink     = #f5c2e7
lavender = #b4befe

; ---------------------------------------------------------------- base
[bar/base]
monitor = ${env:MONITOR:}
bottom = true
width = 100%:-28
height = 30
offset-x = 14
offset-y = 6
radius = 10
fixed-center = true
background = ${colors.base}
foreground = ${colors.text}
line-size = 2
border-size = 1
border-color = ${colors.surface0}
padding-left = 1
padding-right = 2
module-margin = 1
separator = "%{F#45475a}│%{F-}"
font-0 = "AtkynsonMono Nerd Font Propo:size=10;3"
font-1 = "AtkynsonMono Nerd Font Propo:size=13;4"
font-2 = "AtkynsonMono Nerd Font Propo:weight=bold:size=10;3"
font-3 = "DejaVu Sans:size=10;3"
font-4 = "Noto Color Emoji:scale=10;2"
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = false

; ------------------------------------------------- monitor principal (ultrawide)
[bar/main]
inherit = bar/base
modules-left = i3
modules-center = date
modules-right = weather usd updates cpu cputemp memory gpu filesystem network netcheck tray

; ------------------------------------------------- monitor secundário (Dell touch)
[bar/side]
; igual à main, só sem o tray (só pode existir em uma barra)
inherit = bar/base
fixed-center = false
modules-left = i3
modules-center = date
modules-right = weather usd updates cpu cputemp memory gpu filesystem network netcheck

; ================================================================ módulos
[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.peach}
label-mode-foreground = ${colors.crust}
label-focused = %name%
label-focused-foreground = ${colors.crust}
label-focused-background = ${colors.mauve}
label-focused-font = 3
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.subtext}
label-unfocused-padding = 1
label-visible = %name%
label-visible-foreground = ${colors.text}
label-visible-underline = ${colors.surface1}
label-visible-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.crust}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:70:…%
label-foreground = ${colors.subtext}

[module/date]
type = custom/script
exec = ~/.config/polybar/scripts/date.sh
exec-if = true
interval = 5

click-left = ~/.config/polybar/scripts/info.sh date
click-right = ~/.config/polybar/scripts/date.sh --toggle
[module/weather]
type = custom/script
exec = ~/.config/polybar/scripts/weather.sh
interval = 900

click-left = ~/.config/polybar/scripts/info.sh weather
click-right = xdg-open "https://www.meteoblue.com/pt/tempo/semana/santo-%c3%82ngelo_brasil_3450083" >/dev/null 2>&1 &
[module/usd]
type = custom/script
exec = ~/.config/polybar/scripts/usd.sh
interval = 300

click-left = ~/.config/polybar/scripts/info.sh usd
click-right = xdg-open "https://www.google.com/finance/quote/USD-BRL" >/dev/null 2>&1 &
[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 1800

click-left = ~/.config/polybar/scripts/info.sh updates
click-right = ghostty -e sh -c 'yay -Syu; echo; read -p "Enter para fechar" _' &
[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 85
label = %percentage:3%%
format-warn = %{A1:~/.config/polybar/scripts/info.sh cpu:}%{A3:ghostty -e btop &:}%{F#f38ba8}%{T2}󰻠 %{T-}%{F-}<label-warn>%{A}%{A}
label-warn = %percentage:3%%
label-warn-foreground = ${colors.red}

format = %{A1:~/.config/polybar/scripts/info.sh cpu:}%{A3:ghostty -e btop &:}%{F#89b4fa}%{T2}󰻠 %{T-}%{F-}<label>%{A}%{A}
[module/cputemp]
type = internal/temperature
interval = 3
hwmon-path = ${env:CPU_TEMP_PATH:}
base-temperature = 30
warn-temperature = 80
format = %{A1:~/.config/polybar/scripts/info.sh temp:}%{F#fab387}%{T2}󰔏%{T-}%{F-}<label>%{A}
label = %temperature-c:4%
format-warn = %{A1:~/.config/polybar/scripts/info.sh temp:}%{F#f38ba8}%{T2}󰔏%{T-}%{F-}<label-warn>%{A}
label-warn = %temperature-c:4%
label-warn-foreground = ${colors.red}

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 90
label = %gb_free:9%
format-warn = %{A1:~/.config/polybar/scripts/info.sh ram:}%{A3:ghostty -e btop &:}%{F#f38ba8}%{T2}󰍛 %{T-}%{F-}<label-warn>%{A}%{A}
label-warn = %gb_free:9%
label-warn-foreground = ${colors.red}

format = %{A1:~/.config/polybar/scripts/info.sh ram:}%{A3:ghostty -e btop &:}%{F#a6e3a1}%{T2}󰍛 %{T-}%{F-}<label>%{A}%{A}
[module/gpu]
type = custom/script
exec = ~/.config/polybar/scripts/gpu.sh
interval = 3

click-left = ~/.config/polybar/scripts/info.sh gpu
click-right = ghostty -e btop &
[module/filesystem]
type = custom/script
exec = ~/.config/polybar/scripts/disk.sh
interval = 60
click-left = ~/.config/polybar/scripts/info.sh disk
[module/network]
type = internal/network
interface-type = wired
interval = 2
format-connected = %{A1:~/.config/polybar/scripts/info.sh net:}<label-connected>%{A}
label-connected = "%{F#94e2d5}󰇚%{F-} %downspeed:9% %{F#f5c2e7}󰕒%{F-} %upspeed:9%"
label-connected-foreground = ${colors.subtext}
format-disconnected = <label-disconnected>
label-disconnected = "󰌙 cabo desconectado"
label-disconnected-foreground = ${colors.red}

[module/netcheck]
type = custom/script
exec = ~/.config/polybar/scripts/netcheck.sh
interval = 5

click-left = ~/.config/polybar/scripts/info.sh ping
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.sapphire}
ramp-volume-font = 2
format-muted = <label-muted>
label-muted = "󰝟 mudo"
label-muted-foreground = ${colors.overlay0}
click-right = pavucontrol &

[module/mouse]
type = custom/script
exec = ~/.config/polybar/scripts/mouse.sh
interval = 60

click-left = ~/.config/polybar/scripts/info.sh mouse
[module/tray]
type = internal/tray
tray-spacing = 6px
tray-size = 60%
